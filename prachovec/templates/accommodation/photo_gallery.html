<section id="photo-gallery" class="py-5">
    <div class="container">
        <div class="row">
            {% for photo in photos %}
            <div class="col-lg-4 col-sm-6 py-2">
                <div class="thumbnail text-center">
                    <div class="img-container">
                        <img src="{{ photo.image.url }}" class="image" alt="{{ photo.name }}" />
                    </div>
                    <p class="mt-2">{{ photo.description|safe }}</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Pagination Controls -->
        <div class="pagination mt-4">
            <nav>
                <ul class="pagination justify-content-center">
                    {% if photos.has_previous %}
                    <li class="page-item">
                        <a class="page-link" href="?page={{ photos.previous_page_number }}#photo-gallery"
                            aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                    {% endif %}

                    {% for page_num in photos.paginator.page_range %}
                    <li class="page-item {% if page_num == photos.number %}active{% endif %}">
                        <a class="page-link" href="?page={{ page_num }}#photo-gallery">{{ page_num }}</a>
                    </li>
                    {% endfor %}

                    {% if photos.has_next %}
                    <li class="page-item">
                        <a class="page-link" href="?page={{ photos.next_page_number }}#photo-gallery" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                    {% endif %}
                </ul>
            </nav>
        </div>
    </div>
</section>

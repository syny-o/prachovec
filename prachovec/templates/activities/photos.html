{% for photo in photos %}
<div class="col-lg-4 col-sm-6 py-2">
    <div class="thumbnail">
        <div class="img-container">
            <img src="{{ photo.image.url }}" class="image" alt="{{ photo.title }}" />
        </div>
        <p class="mt-2">{{ photo.description|safe }}</p>
    </div>
</div>
{% endfor %}
